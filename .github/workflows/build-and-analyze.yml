name: Build, Test and Analyze
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:

env:
  # renovate: datasource=nuget depName=Altinn.Authorization.RepoCtl
  repoctlVersion: "1.2.0"

jobs:
  check-slns:
    name: Check sln files
    if: ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) || github.event_name == 'push') && github.repository_owner == 'Altinn' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install RepoCtl
        run: |
          dotnet tool install --global Altinn.Authorization.RepoCtl --version "${{ env.repoctlVersion }}"
          
          repoctl --version

      - name: Check repository
        run: repoctl check

  build-and-test:
    name: Build and Test
    if: ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) || github.event_name == 'push') && github.repository_owner == 'Altinn' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore -p:Configuration=Release -bl:binlog/restore.binlog

      - name: Build
        run: dotnet build -c Release --no-restore -warnaserror -bl:binlog/build.binlog

      - name: Test
        run: dotnet test -c Release --no-build -bl:binlog/test.binlog

      - name: Pack
        run: dotnet pack -c Release --no-build -bl:binlog/pack.binlog

      - name: List artifacts
        run: |
          echo "binlog"
          tree binlog

          echo "artifacts"
          tree artifacts

      - name: Create binlog artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binlog
          path: binlog/*.binlog
          if-no-files-found: error
          retention-days: 1

      - name: Create packages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: artifacts/**/*.nupkg
          if-no-files-found: error
          retention-days: 1

