name: Build, Test and Analyze
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:

env:
  # renovate: datasource=nuget depName=Altinn.Authorization.RepoCtl.Cli
  repoctlVersion: "2.0.0"

jobs:
  check-slns:
    name: Check sln files
    if: ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) || github.event_name == 'push') && github.repository_owner == 'Altinn' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install RepoCtl
        run: |
          dotnet tool install --global Altinn.Authorization.RepoCtl.Cli --version "${{ env.repoctlVersion }}"
          
          repoctl --version

      - name: Restore
        run: dotnet restore

      - name: Check repository
        run: repoctl check

  build-and-test:
    name: Build and Test
    if: ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) || github.event_name == 'push') && github.repository_owner == 'Altinn' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore -p:Configuration=Release -bl:binlog/restore.binlog

      - name: Build
        run: dotnet build -c Release --no-restore -warnaserror -bl:binlog/build.binlog

      - name: Test
        run: dotnet test -c Release --no-build -bl:binlog/test.binlog
      
      - name: Run built repoctl
        id: built-repoctl
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./src/tools/Altinn.Authorization.RepoCtl/src/RepoCtl.Cli/bin/Release/net10.0/repoctl check
          ./src/tools/Altinn.Authorization.RepoCtl/src/RepoCtl.Cli/bin/Release/net10.0/repoctl ci find-verticals --filter full

      - name: Print find-verticals output
        env:
          MATRIX: ${{ steps.built-repoctl.outputs.matrix }}
        run: printf '%s\n' "$MATRIX" | jq -C .

      - name: Pack
        run: dotnet pack -c Release --no-build -bl:binlog/pack.binlog

      - name: List artifacts
        run: |
          echo "binlog"
          tree binlog

          echo "artifacts"
          tree artifacts

      - name: Create binlog artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binlog
          path: binlog/*.binlog
          if-no-files-found: error
          retention-days: 1

      - name: Create packages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: artifacts/**/*.nupkg
          if-no-files-found: error
          retention-days: 1

  test-repoctl-windows:
    name: Test RepoCtl on Windows
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - name: Enable long paths in Git
        run: git config --system core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: ${{ runner.temp }}/packages

      - name: Install built RepoCtl
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path "${{ runner.temp }}/packages" -Filter 'Altinn.Authorization.RepoCtl.Cli.*.nupkg' -Recurse -File
          if (@($package).Count -ne 1) { throw 'Expected exactly one RepoCtl CLI package' }
          $version = $package.Name -replace '^Altinn\.Authorization\.RepoCtl\.Cli\.(.+)\.nupkg$', '$1'
          $config = Join-Path "${{ runner.temp }}" 'repoctl-nuget.config'
          '<configuration><packageSources><clear /></packageSources></configuration>' | Set-Content $config
          dotnet tool install --global Altinn.Authorization.RepoCtl.Cli --version $version --configfile $config --add-source $package.DirectoryName

      - name: Restore
        run: dotnet restore

      - name: Check repository
        run: repoctl check

      - name: List verticals
        run: repoctl verticals list

